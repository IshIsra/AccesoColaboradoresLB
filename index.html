<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Liceo Boston</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* Todo tu estilo aquí (igual que antes) */
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Iniciar sesión</h2>
    <input type="email" id="email" placeholder="Correo institucional" />
    <input type="password" id="password" placeholder="Contraseña" />
    <span class="link" onclick="recoverPassword()">¿Olvidaste tu contraseña?</span>
    <button onclick="login()">Ingresar</button>
    
    <div id="g_id_onload"
      data-client_id="1074629241014-kfcusssthr1hk1nnr3viemncl0imr41e.apps.googleusercontent.com"
      data-login_uri="https://IshIsra.github.io/loginliceo"
      data-auto_prompt="false">
    </div>

    <div class="g_id_signin"
      data-type="standard"
      data-shape="rectangular"
      data-theme="outline"
      data-text="signin_with"
      data-size="large"
      data-logo_alignment="left">
    </div>
  </div>

  <script>
    function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (email.endsWith("@liceoboston.edu.co") && password === "12345") {
        window.location.href = "https://sites.google.com/liceoboston.edu.co/liceobostonth/inicio";
      } else {
        alert("Correo o contraseña inválidos. Usa un correo institucional y la contraseña 12345.");
      }
    }

    function recoverPassword() {
      alert("Recuperación de contraseña simulada. Serás redirigido al sitio institucional.");
      window.location.href = "https://sites.google.com/liceoboston.edu.co/liceobostonth/inicio";
    }
  </script>
</body>
</html>
