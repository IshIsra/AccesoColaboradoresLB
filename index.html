<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Liceo Boston</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Roboto', sans-serif;
      transition: all 0.3s ease;
    }
    body {
      margin: 0;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 1rem;
    }
    .login-container {
      background: #1e293b;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      margin: 0.5rem 0;
      border: none;
      border-radius: 10px;
      outline: none;
      background: #334155;
      color: #f8fafc;
    }
    input:focus {
      border: 2px solid #60a5fa;
      background: #1e293b;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1rem;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }
    button:disabled {
      background: #1e40af;
      cursor: not-allowed;
    }
    .link {
      display: block;
      text-align: right;
      margin-top: 0.5rem;
      color: #93c5fd;
      cursor: pointer;
    }
    .g_id_signin {
      margin-top: 1rem;
    }
    .message {
      margin-top: 1rem;
      color: #facc15;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Iniciar sesión</h2>
    <input type="email" id="email" placeholder="Correo institucional" />
    <input type="password" id="password" placeholder="Contraseña" />
    <span class="link" onclick="recoverPassword()">¿Olvidaste tu contraseña?</span>
    <button id="loginBtn" onclick="login()">Ingresar</button>
    <div class="message" id="message"></div>

    <!-- Botón de Google -->
    <div id="g_id_onload"
      data-client_id="1074629241014-kfcusssthr1hk1nnr3viemncl0imr41e.apps.googleusercontent.com"
      data-login_uri="https://ishisra.github.io/loginliceo"
      data-auto_prompt="false"
      data-callback="handleCredentialResponse">
    </div>
    <div class="g_id_signin"
      data-type="standard"
      data-shape="rectangular"
      data-theme="outline"
      data-text="signin_with"
      data-size="large"
      data-logo_alignment="left">
    </div>
  </div>

  <script>
    let failedAttempts = 0;
    const encodedPassword = "MTIzNDU="; // "12345" en base64

    function decodePassword(encoded) {
      return atob(encoded);
    }

    function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const loginBtn = document.getElementById('loginBtn');
      const message = document.getElementById('message');

      loginBtn.disabled = true;
      message.textContent = "Verificando...";

      setTimeout(() => {
        const validPassword = decodePassword(encodedPassword);

        if (email.endsWith("@liceoboston.edu.co") && password === validPassword) {
          window.location.href = "https://sites.google.com/liceoboston.edu.co/liceobostonth/inicio";
        } else {
          failedAttempts++;
          if (failedAttempts >= 3) {
            message.textContent = "Demasiados intentos fallidos. Usa tu cuenta institucional de Google.";
          } else {
            message.textContent = "Correo o contraseña inválidos. Intenta nuevamente o accede con Google.";
          }
        }

        loginBtn.disabled = false;
      }, 1000); // Simula tiempo de carga
    }

    function recoverPassword() {
      const email = document.getElementById('email').value.trim();
      const message = document.getElementById('message');

      if (!email) {
        message.textContent = "Por favor ingresa un correo para verificar.";
        return;
      }

      if (email.endsWith("@liceoboston.edu.co")) {
        message.textContent = "Este correo está vinculado a Google. Inicia sesión directamente con Google.";

        const googleButton = document.querySelector('.g_id_signin');
        if (googleButton) {
          googleButton.scrollIntoView({ behavior: 'smooth' });
          googleButton.style.outline = "2px solid #2563eb";
        }
      } else {
        message.textContent = "Este correo no tiene una cuenta registrada.";
      }
    }

    function handleCredentialResponse(response) {
      const data = parseJwt(response.credential);
      const email = data.email;

      if (email && email.endsWith("@liceoboston.edu.co")) {
        window.location.href = "https://sites.google.com/liceoboston.edu.co/liceobostonth/inicio";
      } else {
        alert("Solo se permite iniciar sesión con cuentas @liceoboston.edu.co");
      }
    }

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));

      return JSON.parse(jsonPayload);
    }
  </script>
</body>
</html>
